# XcodeGen project spec — the ONLY source of truth for the Xcode project.
# `xcodegen generate` (run by CI, see .github/workflows/ios-ci.yml) turns this into
# GotTime.xcodeproj, which is gitignored and never hand-edited or committed.
#
# Signing is deliberately disabled at the project level for now (see the CODE_SIGNING_*
# settings below) because through Phase 3 every CI build targets the iOS Simulator, which
# needs no signing identity at all. Phase 4 introduces a second, separate CI job that signs
# real device/archive builds with an App Store Connect API key once Apple Developer
# credentials exist — that job overrides signing settings itself rather than this file
# assuming a team/profile that doesn't exist yet.

name: GotTime
options:
  bundleIdPrefix: com.stevenkinney
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # App Store Connect validation rejected a Portrait-only declaration even though
    # TARGETED_DEVICE_FAMILY is iPhone-only (below), citing iPad multitasking's
    # all-4-orientations requirement — the ~ipad-suffixed key alone wasn't enough to satisfy
    # it, so the base (non-suffixed) key now also lists all 4. Functionally harmless either
    # way since this app never runs on iPad at all; found from a real rejected-upload error,
    # not anticipated ahead of time.
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_CFBundleDisplayName: "GotTime?"
    # Declares the standard-HTTPS-only encryption exemption up front so App Store Connect
    # never has to ask the "does your app use encryption" question on every single TestFlight
    # build — accurate here since networking (Supabase, Twilio, APNs) is all system
    # URLSession/TLS, nothing custom.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    # Required for the Twilio Voice SDK to access the microphone on any connected call (both
    # outgoing and incoming) -- without this, iOS refuses microphone access outright the moment
    # a call actually reaches "connected." Every call attempt so far has failed before ever
    # reaching that point, so this gap hadn't surfaced yet; added proactively while wiring up
    # real incoming calls, the same way the App Store icon/orientation gaps were caught before
    # they became a separate failed round-trip. See DECISIONS.md.
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "GotTime? needs your microphone during a call so the other person can hear you."
    MARKETING_VERSION: "0.1.0"
    # Bumped each time a real device test needs a fresh build. Apple rejects re-uploading the
    # same build number twice, and per Apple's own review-scoping rules, a later build of the
    # *same* version (0.1.0 unchanged) shouldn't need a fresh Beta App Review -- only the first
    # build of a new version does. 1->2: literal-value INFOPLIST_KEY_ fix (didn't resolve the
    # crash). 2->3: on-screen config diagnostics (found the real cause). 3->4: real fix --
    # SupabaseConfig.swift plain constants, replacing INFOPLIST_KEY_* entirely. 4->5: onboarding
    # Continue-button fix (SupabaseAuthAdapter.updateFirstName wasn't re-emitting auth state).
    # 5->6: invite-redeem trim + real error surfacing -- best-effort fix, not a confirmed root
    # cause yet. 6->7: PeopleListView never refreshed after AddConnectionView dismissed --
    # confirmed root cause (a real connection existed server-side the whole time). 7->8:
    # PushKitAdapter -- real calls always ended in Twilio-side "no-answer" because neither
    # device had ever registered to receive one; a genuine Phase-5-into-Phase-4 dependency
    # discovered only by testing a real call. 8->9: real device retest still failed identically
    # even after wiring the VoIP Services Certificate/Twilio Push Credential (build 8 -> backend
    # config), with zero errors anywhere in Twilio's own logs -- meaning the failure is likely
    # upstream of Twilio ever seeing an attempt. PushKitAdapter's own TwilioVoiceSDK.register
    # result was being silently discarded (`try?`), a real blind spot; this build reports real
    # requested/registered/failed status to profiles (migration 0007) so the next failure is
    # diagnosable remotely instead of guessed again. See DECISIONS.md. 9->10: build 9's real
    # retest came back "requested" on both phones and never advanced -- PushKit itself never
    # handed out a token. The one load-bearing assumption behind that requirement
    # (INFOPLIST_KEY_UIBackgroundModes's space-separated-array value actually landing in the
    # compiled Info.plist) was only ever confirmed for a different key, never this one -- this
    # build reads UIBackgroundModes back from the real compiled bundle and reports it alongside
    # "requested" so that assumption gets checked with real evidence instead of guessed a third
    # time. See DECISIONS.md. 10->11: build 10's on-device evidence came back
    # UIBackgroundModes=[] on two separate real phones -- confirmed root cause, not another
    # guess. Fixed via a partial physical Info.plist (Config/Info.plist) merged with the existing
    # INFOPLIST_KEY_* settings, Xcode's actual documented mechanism for array-valued keys that
    # don't have real INFOPLIST_KEY_ synthesis support. See DECISIONS.md. 11->12: build 11's real
    # retest was genuine progress -- both phones registered successfully, and Twilio's own call
    # events show a real ~10s "ringing" phase (SIP 487 at the end, consistent with the caller
    # canceling) instead of the instant 0-duration no-answer every earlier attempt showed. But
    # the recipient's phone still never surfaced an incoming call. The entire incoming-push
    # handling path (PushKitAdapter's didReceiveIncomingPushWith/callInviteReceived) has never
    # reported anything, the same kind of blind spot the outgoing side had before migration 0007
    # -- this build closes it for the incoming side too (migration 0008), so the next real test
    # shows exactly which step succeeds or fails instead of another guess. See DECISIONS.md.
    # 12->13: build 12's CI failed to even compile -- AnyHashable (dictionaryPayload's key type)
    # isn't Comparable, so .keys.sorted() in the new incoming-push diagnostic didn't type-check.
    # No device to catch this ahead of a push; fixed from CI's own real error text. See
    # DECISIONS.md. 13->14: the real bug behind "stuck in Calling forever, on both accept AND
    # decline." CallStateMachine requires created->outgoing before ringing/connected are valid,
    # but nothing anywhere ever performed that transition (client or server) -- every real
    # status event since this project began was silently rejected by applyAndEmit's own `try?`
    # guard, on both the caller's and the recipient's side. Fixed in all three places: request-
    # call now creates rows as "outgoing" directly; startCall applies the same transition
    # locally; answer() promotes the incoming invite's session through outgoing->ringing before
    # callDidConnect can fire. See DECISIONS.md. 14->15: build 14's real retest was the closest
    # yet -- the caller's own countdown genuinely ran, a first -- but the recipient's own screen
    # stayed on a spinner and never connected, even though the caller's success proves Twilio
    # really did bridge the call. Rather than guess a fifth code change, applyAndEmit (the choke
    # point every CallDelegate callback funnels through, on both ends) now reports exactly which
    # of its three failure modes fires, or that it succeeded, to profiles (migration 0009). See
    # DECISIONS.md. 15->16: build 15's real retest (a second, different recipient -- the wife,
    # not the brother) reproduced the exact same "stuck in Calling" symptom, but
    # last_call_event_status came back completely null -- applyAndEmit never even ran, and her
    # own fresh push-registration/incoming-push diagnostics rule out an auth/session problem.
    # That points earlier than applyAndEmit: instrumented pendingInviteMatching (the single
    # choke point answer()/decline() both call before doing anything else) to report whether the
    # invite is actually found, settling a UUID-mismatch theory (Twilio's own CallInvite.uuid vs
    # this app's call_uuid) that was floated and provisionally set aside for lack of direct
    # evidence. See DECISIONS.md. 16->17: confirmed with real evidence, not a guess --
    # last_call_event_status showed "invite_not_pending" with two genuinely different UUIDs.
    # callInvite.uuid (Twilio's own SDK-local id on this device) has no relationship to
    # call_sessions.call_uuid (chosen only by the caller's own device) -- so answer()/decline()
    # always threw before ever reaching Twilio on the recipient's side, and activeCall never got
    # set, so cancel/end also silently did nothing. Fixed by overriding the incoming session's
    # callUUID with callInvite.uuid at the point PushKitAdapter receives it -- callUUID is a
    # purely local SDK-matching field, never sent to the server or shown in any UI. See
    # DECISIONS.md. 17->18: build 17's real retest confirmed full two-way signaling (connect,
    # hangup from either side) works for the first time -- and surfaced three real, separate
    # gaps: (1) no audio in either direction -- confirmed nothing had ever requested microphone
    # permission; (2) the two participants' countdown timers visibly desync based on how long
    # the recipient takes to answer, because each device stamps connectedAt from its own local
    # clock; (3) investigating (2) found Twilio's own status-callback event is actually named
    # "in-progress", not "answered" as originally assumed, so connected_at had never once been
    # set server-side for any call. Fixed all three: explicit mic permission request,
    # server-authoritative connected_at reconciliation (now possible since the in-progress fix
    # makes the server value real), and the naming fix itself. Also added the owner's requested
    # 15s/30s/1min/3min duration presets (request-call's floor lowered from 60s to 15s to allow
    # them). See DECISIONS.md. 18->19: build 18's retest found the mic-permission fix alone
    # wasn't enough -- still no audio even with permission granted on both phones -- and the
    # timer still desynced. Root cause for both, confirmed via Twilio's own docs (not guessed):
    # ConnectOptions.uuid/AcceptOptions.uuid (forced since Phase 4, to make Twilio's own Call/
    # CallInvite uuid match this app's call_uuid for matching purposes) tells the SDK "this app
    # manages CallKit's own audio activation" -- since this app never does (no CallKit yet), the
    # SDK's automatic audio-device activation was silently disabled the entire time. Stopped
    # forcing it; matching now uses Call object identity (for CallDelegate routing) and this
    # app's own call_uuid exclusively (for answer/decline/cancel), never Twilio's own uuid
    # fields, which are documented as genuinely optional once no longer forced. Separately, the
    # timer reconciliation's retry window (2s) was far shorter than a realistic time-to-answer
    # (confirmed ~6s in the actual failed test) -- widened to 60s. See DECISIONS.md. 19->20:
    # build 19's retest confirmed the real fix -- audio worked, the countdown synced (a brief,
    # expected local-then-corrected reset, not a bug), and the call auto-ended at zero. Found one
    # real display bug testing a 15s call: IncomingCallView/HistoryView both divided
    # requestedDurationSeconds by 60 with integer division, showing "0 minutes" for anything
    # under a minute. Fixed, and added a proper minutes+seconds custom-duration entry (replacing
    # the old whole-minutes-only text field) plus a shared DurationPolicy.formatDuration used
    # everywhere a duration is displayed, per the owner's own request for fully arbitrary
    # durations like "1 minute and 12 seconds." See DECISIONS.md. 20->21: owner asked to be able
    # to tell a declined call apart from one nobody answered. Found this was already fully
    # designed into CallStatus/CallStateMachine/ActiveCallView since Phase 1 (.declined and
    # .missed are distinct cases with distinct summary text) but never correctly produced by the
    # real TwilioVoiceAdapter -- callDidDisconnect always fell back to .failed for any
    # never-connected disconnect, including the caller's own explicit cancel. Added
    # pendingLocalOutcome (sets the real outcome immediately for local cancel/endEarly actions)
    # and a brief server reconciliation for the recipient-declined case (recorded authoritatively
    # via the recipient's own call-action call, which this device has no other way to learn
    # about). See DECISIONS.md. 21->22: Phase 5 CallKit integration, per the owner's explicit
    # request to see the requested duration on the lock screen and answer/decline natively, done
    # "the right way the first time" rather than deferred. Added CallKitAdapter (CXProvider/
    # CXProviderDelegate) reporting incoming calls with a composed "Name • Duration"
    # localizedCallerName (no reliable separate subtitle field exists pre-unlock), routing native
    # Answer/End actions back into TwilioVoiceAdapter, and toggling DefaultAudioDevice activation
    # from didActivate/didDeactivate. This requires CallKit, not TwilioVoiceAdapter's own SDK, to
    # own audio-session activation for incoming calls -- so AcceptOptions.uuid is set again
    # (paired with CallKitAdapter's didActivate handling this time, unlike the build 18 regression
    # where the same setting was forced with no CallKit present to justify it). Also added
    # GotTimeAppDelegate (UIApplicationDelegateAdaptor) so VoIP push registration happens at true
    # app-launch time instead of lazily inside a SwiftUI .task -- needed because a fully
    # terminated app can only be woken by a VoIP push and must report to CallKit synchronously,
    # before any view has ever rendered. CallCoordinator's event handler now also promotes an
    # incoming call to active on CallKit's own native Answer path (which calls voiceAdapter.answer
    # directly, bypassing this app's own answerIncomingCall()), and correctly clears a
    # cancelled/declined incoming call that was never promoted. Scoped to incoming calls only this
    # round; outgoing calls remain on the already-confirmed-working non-CallKit path. Not yet
    # tested on a real device -- needs a locked-screen/force-quit test specifically, since that is
    # the exact scenario this build exists for. See DECISIONS.md. 22->23: build 22 failed to even
    # compile -- GotTimeAppDelegate's `let environment: AppEnvironment = Self.resolvedEnvironment()`
    # doesn't type-check; Swift disallows a covariant `Self` reference in a stored property
    # initializer even on a `final` class. Fixed by naming the type explicitly
    # (`GotTimeAppDelegate.resolvedEnvironment()`) -- no other errors in the same CI run. See
    # DECISIONS.md. 23->24: build 23's real two-device test (locked phone, answered via CallKit)
    # surfaced two real gaps, neither related to CallKit itself. (1) The call answered from the
    # lock screen never ended when the timer reached zero, even though the caller's own screen
    # correctly moved on -- confirmed by grep that TwilioVoiceAdapter never once produced
    # `.timedOut`; the "confirmed working" auto-disconnect from Phase 4 testing was never actually
    # built for the real adapter, only for MockVoiceService. Fixed: TwilioVoiceAdapter now
    # schedules its own local expiry from `connectedAt` the same way MockVoiceService always did,
    # and genuinely calls `call.disconnect()` at zero -- runs on both participants' own devices
    # independently, with no dependency on any view being on screen, so it works identically for a
    # locked/CallKit-answered call. (2) History was still showing GotTimeMocks' seeded placeholder
    # entries -- `callHistoryService` was the one service deliberately left mocked since Phase 1
    # while the harder voice/CallKit work took priority (see AppEnvironment.swift's own doc
    # comment); added a real `SupabaseCallHistoryAdapter` reading directly from `call_sessions`,
    # exactly as `CallHistoryService`'s protocol doc comment always said a real implementation
    # would. See DECISIONS.md.
    CURRENT_PROJECT_VERSION: "24"

packages:
  GotTimeCore:
    path: Packages/GotTimeCore
  GotTimeMocks:
    path: Packages/GotTimeMocks
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  TwilioVoice:
    url: https://github.com/twilio/twilio-voice-ios
    from: 6.13.0

targets:
  GotTime:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: GotTimeCore
      - package: GotTimeMocks
      - package: Supabase
        product: Supabase
      - package: TwilioVoice
        product: TwilioVoice
    entitlements:
      path: Config/GotTime.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # Required for PushKit VoIP push registration (TwilioVoiceSDK.register), discovered as
        # a hard requirement when a real device test proved neither side of a call could ever
        # receive one -- see DECISIONS.md. "production" (not "development", unlike Twilio's own
        # quickstart samples, which target local Xcode Development-signed debug runs) because
        # every real build here ships via TestFlight with Distribution-style signing, never a
        # local Development-signed run.
        aps-environment: production
    settings:
      base:
        PRODUCT_NAME: GotTime
        PRODUCT_BUNDLE_IDENTIFIER: com.stevenkinney.gottime
        # Matches the App ID being registered in the Apple Developer portal for Phase 2 with
        # Sign in with Apple enabled (see DECISIONS.md/BUILD_STATUS.md) — one line to change
        # here if that registration ever needs a different bundle ID.
        #
        # Supabase project ref/anon key are NOT here or in Info.plist at all anymore — two real
        # device launches proved custom INFOPLIST_KEY_* settings never actually synthesize into
        # this project's compiled Info.plist (only real, Apple-defined keys do; confirmed via an
        # on-screen Bundle.main.infoDictionary dump showing every standard key present but
        # neither custom one anywhere in the list). They're now plain Swift constants instead —
        # see SupabaseConfig.swift. See DECISIONS.md for the full story.
        # AppIcon.appiconset (App/Resources/Assets.xcassets) — a real functional placeholder
        # (simple stopwatch glyph in the app's actual gtAccent color), not final branding.
        # App Store Connect rejects any upload with no icon at all, even for Internal Testing,
        # so this couldn't wait for Phase 8's visual polish pass — found from a real rejected
        # upload, see DECISIONS.md.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        # UIBackgroundModes ("voip"/"audio") turned out NOT to be one of the INFOPLIST_KEY_*
        # settings Xcode actually synthesizes -- confirmed directly (not assumed) via build 10's
        # on-device diagnostic, which read Bundle.main.infoDictionary["UIBackgroundModes"] back
        # from the real compiled app on two separate real devices and got back an empty array,
        # even though the build setting was present. Unlike the earlier Supabase-config crash
        # (fixed by moving those values OUT of Info.plist into a plain Swift file), the OS itself
        # reads UIBackgroundModes directly from the compiled Info.plist -- there's no
        # code-level workaround, so this uses Xcode's actual documented mechanism for exactly
        # this situation instead: GENERATE_INFOPLIST_FILE: YES (still true, project-level) merges
        # a partial physical Info.plist (INFOPLIST_FILE below) with the INFOPLIST_KEY_* settings,
        # rather than either replacing the other. See DECISIONS.md.
        INFOPLIST_FILE: Config/Info.plist

  GotTimeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GotTimeUITests
    dependencies:
      - target: GotTime
    # No signing override needed here — it inherits CODE_SIGNING_ALLOWED: NO etc. from the
    # project-level base settings above, the same way every target inherits project settings.

schemes:
  GotTime:
    build:
      targets:
        GotTime: all
        GotTimeUITests: [test]
    test:
      config: Debug
      targets:
        - GotTimeUITests
    run:
      config: Debug
    archive:
      config: Release
