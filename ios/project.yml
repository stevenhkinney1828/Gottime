# XcodeGen project spec — the ONLY source of truth for the Xcode project.
# `xcodegen generate` (run by CI, see .github/workflows/ios-ci.yml) turns this into
# GotTime.xcodeproj, which is gitignored and never hand-edited or committed.
#
# Signing is deliberately disabled at the project level for now (see the CODE_SIGNING_*
# settings below) because through Phase 3 every CI build targets the iOS Simulator, which
# needs no signing identity at all. Phase 4 introduces a second, separate CI job that signs
# real device/archive builds with an App Store Connect API key once Apple Developer
# credentials exist — that job overrides signing settings itself rather than this file
# assuming a team/profile that doesn't exist yet.

name: GotTime
options:
  bundleIdPrefix: com.stevenkinney
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # App Store Connect validation rejected a Portrait-only declaration even though
    # TARGETED_DEVICE_FAMILY is iPhone-only (below), citing iPad multitasking's
    # all-4-orientations requirement — the ~ipad-suffixed key alone wasn't enough to satisfy
    # it, so the base (non-suffixed) key now also lists all 4. Functionally harmless either
    # way since this app never runs on iPad at all; found from a real rejected-upload error,
    # not anticipated ahead of time.
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_CFBundleDisplayName: "GotTime?"
    # Declares the standard-HTTPS-only encryption exemption up front so App Store Connect
    # never has to ask the "does your app use encryption" question on every single TestFlight
    # build — accurate here since networking (Supabase, Twilio, APNs) is all system
    # URLSession/TLS, nothing custom.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    # Required for the Twilio Voice SDK to access the microphone on any connected call (both
    # outgoing and incoming) -- without this, iOS refuses microphone access outright the moment
    # a call actually reaches "connected." Every call attempt so far has failed before ever
    # reaching that point, so this gap hadn't surfaced yet; added proactively while wiring up
    # real incoming calls, the same way the App Store icon/orientation gaps were caught before
    # they became a separate failed round-trip. See DECISIONS.md.
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "GotTime? needs your microphone during a call so the other person can hear you."
    # "voip" lets PushKit wake the app for an incoming call notification; "audio" keeps an
    # already-connected call's audio session alive if the app is backgrounded mid-call. Space-
    # separated string, matching the same array-value convention already confirmed working for
    # INFOPLIST_KEY_UISupportedInterfaceOrientations above (verified present via the on-screen
    # Info.plist dump earlier, not assumed).
    INFOPLIST_KEY_UIBackgroundModes: "voip audio"
    MARKETING_VERSION: "0.1.0"
    # Bumped each time a real device test needs a fresh build. Apple rejects re-uploading the
    # same build number twice, and per Apple's own review-scoping rules, a later build of the
    # *same* version (0.1.0 unchanged) shouldn't need a fresh Beta App Review -- only the first
    # build of a new version does. 1->2: literal-value INFOPLIST_KEY_ fix (didn't resolve the
    # crash). 2->3: on-screen config diagnostics (found the real cause). 3->4: real fix --
    # SupabaseConfig.swift plain constants, replacing INFOPLIST_KEY_* entirely. 4->5: onboarding
    # Continue-button fix (SupabaseAuthAdapter.updateFirstName wasn't re-emitting auth state).
    # 5->6: invite-redeem trim + real error surfacing -- best-effort fix, not a confirmed root
    # cause yet. 6->7: PeopleListView never refreshed after AddConnectionView dismissed --
    # confirmed root cause (a real connection existed server-side the whole time). 7->8:
    # PushKitAdapter -- real calls always ended in Twilio-side "no-answer" because neither
    # device had ever registered to receive one; a genuine Phase-5-into-Phase-4 dependency
    # discovered only by testing a real call. 8->9: real device retest still failed identically
    # even after wiring the VoIP Services Certificate/Twilio Push Credential (build 8 -> backend
    # config), with zero errors anywhere in Twilio's own logs -- meaning the failure is likely
    # upstream of Twilio ever seeing an attempt. PushKitAdapter's own TwilioVoiceSDK.register
    # result was being silently discarded (`try?`), a real blind spot; this build reports real
    # requested/registered/failed status to profiles (migration 0007) so the next failure is
    # diagnosable remotely instead of guessed again. See DECISIONS.md.
    CURRENT_PROJECT_VERSION: "9"

packages:
  GotTimeCore:
    path: Packages/GotTimeCore
  GotTimeMocks:
    path: Packages/GotTimeMocks
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  TwilioVoice:
    url: https://github.com/twilio/twilio-voice-ios
    from: 6.13.0

targets:
  GotTime:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: GotTimeCore
      - package: GotTimeMocks
      - package: Supabase
        product: Supabase
      - package: TwilioVoice
        product: TwilioVoice
    entitlements:
      path: Config/GotTime.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # Required for PushKit VoIP push registration (TwilioVoiceSDK.register), discovered as
        # a hard requirement when a real device test proved neither side of a call could ever
        # receive one -- see DECISIONS.md. "production" (not "development", unlike Twilio's own
        # quickstart samples, which target local Xcode Development-signed debug runs) because
        # every real build here ships via TestFlight with Distribution-style signing, never a
        # local Development-signed run.
        aps-environment: production
    settings:
      base:
        PRODUCT_NAME: GotTime
        PRODUCT_BUNDLE_IDENTIFIER: com.stevenkinney.gottime
        # Matches the App ID being registered in the Apple Developer portal for Phase 2 with
        # Sign in with Apple enabled (see DECISIONS.md/BUILD_STATUS.md) — one line to change
        # here if that registration ever needs a different bundle ID.
        #
        # Supabase project ref/anon key are NOT here or in Info.plist at all anymore — two real
        # device launches proved custom INFOPLIST_KEY_* settings never actually synthesize into
        # this project's compiled Info.plist (only real, Apple-defined keys do; confirmed via an
        # on-screen Bundle.main.infoDictionary dump showing every standard key present but
        # neither custom one anywhere in the list). They're now plain Swift constants instead —
        # see SupabaseConfig.swift. See DECISIONS.md for the full story.
        # AppIcon.appiconset (App/Resources/Assets.xcassets) — a real functional placeholder
        # (simple stopwatch glyph in the app's actual gtAccent color), not final branding.
        # App Store Connect rejects any upload with no icon at all, even for Internal Testing,
        # so this couldn't wait for Phase 8's visual polish pass — found from a real rejected
        # upload, see DECISIONS.md.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon

  GotTimeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GotTimeUITests
    dependencies:
      - target: GotTime
    # No signing override needed here — it inherits CODE_SIGNING_ALLOWED: NO etc. from the
    # project-level base settings above, the same way every target inherits project settings.

schemes:
  GotTime:
    build:
      targets:
        GotTime: all
        GotTimeUITests: [test]
    test:
      config: Debug
      targets:
        - GotTimeUITests
    run:
      config: Debug
    archive:
      config: Release
