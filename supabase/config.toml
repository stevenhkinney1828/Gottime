# Supabase CLI project configuration — used by `supabase functions deploy` against the real,
# hosted project (Phase 2+). Deliberately does NOT include [api]/[db]/[studio]/[auth]/
# [edge_runtime] sections for the local Docker emulator (`supabase start`), which this project
# has never used — see DECISIONS.md and KNOWN_LIMITATIONS.md for why local verification
# instead uses a plain winget-installed Postgres + supabase/seed/auth_shim.sql. Those sections
# used to be here (harmless for the local CLI, which never complained about them), but
# `functions deploy` sends this whole file to Supabase's *hosted* config parser, which is
# stricter and rejected one of them with an opaque "ProjectConfigParseError" that gave no hint
# which section was the problem — removing everything but what deploy actually needs both
# fixed it and deleted genuinely-unused configuration. If `supabase start` is ever adopted
# later, those sections can come back, ideally added back one at a time against a real deploy
# to catch a repeat of this immediately rather than guessing again.

project_id = "wraowtlpekpmpekkcquq"

# Per-function settings, one sub-table each — the CLI (2.x) requires this form; a single
# global [functions] block with a bare verify_jwt is a deprecated schema that separately also
# failed to parse. Only twiml-voice and twilio-status-callback are called by Twilio directly
# rather than by an authenticated app user, so only those two turn JWT verification off.
[functions.request-call]
verify_jwt = true

[functions.call-action]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.issue-voice-token]
verify_jwt = true

[functions.register-device]
verify_jwt = true

[functions.expire-call-sweep]
verify_jwt = true

[functions.twiml-voice]
verify_jwt = false

[functions.twilio-status-callback]
verify_jwt = false
