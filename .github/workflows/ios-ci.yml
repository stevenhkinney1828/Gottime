name: iOS CI

# This is the only "Mac" this project uses — see ARCHITECTURE.md. Every push regenerates the
# Xcode project from ios/project.yml (never a committed .xcodeproj) and builds/tests against
# an iOS Simulator, which needs no signing identity at all. The sign-and-upload job below
# handles Phase 4+ TestFlight delivery and safely does nothing until those secrets exist.

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build & test (Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Test GotTimeCore package
        working-directory: ios/Packages/GotTimeCore
        run: swift test

      - name: Test GotTimeMocks package
        working-directory: ios/Packages/GotTimeMocks
        run: swift test

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          # Deliberately relies on no simctl positional-argument filtering (category/search
          # term ordering isn't hand-verifiable in this project's environment) — just the
          # plain `list --json` form, with every filter expressed in jq instead.
          DEVICE_UDID=$(xcrun simctl list --json \
            | jq -r '[.devices[][] | select(.isAvailable == true and (.name | test("iPhone")))] | .[0].udid // empty')
          if [ -z "$DEVICE_UDID" ]; then
            echo "No available iPhone simulator found on this runner image" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Selected simulator UDID: $DEVICE_UDID"
          echo "udid=$DEVICE_UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test app + UI tests
        working-directory: ios
        run: |
          xcodebuild test \
            -project GotTime.xcodeproj \
            -scheme GotTime \
            -destination "id=${{ steps.simulator.outputs.udid }}"

  # Phase 4+ only. Always runs so it shows up green in the Actions UI, but its real steps are
  # skipped until APP_STORE_CONNECT_API_KEY_ID (and the other signing secrets) exist — so this
  # file is complete and correct from Phase 0 onward rather than needing a rewrite later.
  #
  # Originally written before real Apple credentials existed to sign anything with — unlike
  # every backend piece built the same way (Edge Function logic tested against fakes before
  # real Twilio/Supabase creds existed), there was no local or fake way to test xcodebuild
  # signing flags ahead of time; real App Store Connect credentials were the only possible test
  # harness for this job. Every flag/plist key below was checked against Apple's own xcodebuild
  # man page and current documentation (see DECISIONS.md). The first real run did find a real
  # issue (Archive failed: CryptoKitASN1Error.invalidPEMDocument — the saved .p8 secret didn't
  # parse, a Notepad copy-paste artifact, not a bug in this file) — the owner re-saved that one
  # secret with the corrected content; this push is the retry. See DECISIONS.md/BUILD_STATUS.md
  # for the outcome once it lands.
  sign-and-upload:
    name: Sign & upload to TestFlight
    needs: build-and-test
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Check signing credentials are configured
        id: check
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_ID" ]; then
            echo "App Store Connect signing isn't configured yet (Phase 4+) — nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install XcodeGen
        if: steps.check.outputs.ready == 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.check.outputs.ready == 'true'
        working-directory: ios
        run: xcodegen generate

      # AuthKey_<key ID>.p8 is the exact filename App Store Connect gives you on download, and
      # is passed here by its full explicit path rather than relying on xcodebuild's own
      # default search directories (~/private_keys, ~/.appstoreconnect/private_keys, etc.) —
      # simpler to reason about than depending on unwritten-here search-order behavior.
      - name: Write App Store Connect API key to disk
        if: steps.check.outputs.ready == 'true'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          AUTH_KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_KEY_P8" > "$AUTH_KEY_PATH"
          echo "AUTH_KEY_PATH=$AUTH_KEY_PATH" >> "$GITHUB_ENV"

      # CODE_SIGN_STYLE/CODE_SIGNING_* are passed as build-setting overrides on the command
      # line, not changed in project.yml itself — the checked-in project deliberately disables
      # signing at the project level (see project.yml's own header comment) so the always-running
      # Simulator job above never needs a signing identity. -allowProvisioningUpdates lets
      # xcodebuild create/update the app's certificates and provisioning profile itself via the
      # API key's authority (this is what "automatic signing" means for a headless CI box with
      # no prior manual Xcode/Keychain setup).
      - name: Archive
        if: steps.check.outputs.ready == 'true'
        working-directory: ios
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project GotTime.xcodeproj \
            -scheme GotTime \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/GotTime.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID"

      # destination=upload makes -exportArchive both export AND upload directly to App Store
      # Connect/TestFlight in one step — no separate altool/Transporter call needed. "method"
      # must be app-store-connect, not the older app-store value Xcode 15+ deprecated.
      - name: Write export options plist
        if: steps.check.outputs.ready == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST

      - name: Export & upload to TestFlight
        if: steps.check.outputs.ready == 'true'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GotTime.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"
