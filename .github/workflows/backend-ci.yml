name: Backend CI

# Mirrors exactly what already runs locally on the (Windows, no-Mac) dev machine via
# `deno task test` / `lint` / `fmt` — see backend/README.md. This workflow is a gatekeeper,
# not the only verification path, unlike ios-ci.yml.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "supabase/functions/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch: {}

jobs:
  test:
    name: Format, lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Test
        run: deno test --allow-env --allow-net
